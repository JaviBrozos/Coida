<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeo de Doado</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #05090e; color: #F2F7FB; font: 600 16px DoadoInter, Roboto, system-ui, sans-serif; display: grid; grid-template-rows: 1fr auto; height: 100vh; }
  main { display: grid; place-items: center; min-height: 0; padding: 12px; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #0A1622; }
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px 16px; border-top: 1px solid #17384F; }
  button { font: inherit; min-height: 48px; padding: 0 20px; border-radius: 14px; border: 2px solid #3D7AA6; background: #122A3E; color: #F2F7FB; cursor: pointer; }
  button.primario { background: #29B6F0; border-color: #29B6F0; color: #0A1622; }
  button:focus-visible, input:focus-visible { outline: 3px solid #29B6F0; outline-offset: 3px; }
  input[type=range] { flex: 1 1 320px; min-height: 48px; accent-color: #29B6F0; }
  output { min-width: 9ch; font-variant-numeric: tabular-nums; color: #9FC4DC; }
  label { display: inline-flex; gap: 8px; align-items: center; color: #9FC4DC; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main><canvas id="lienzo" width="1920" height="1080" aria-label="Vídeo de Doado"></canvas></main>
<div class="barra">
  <button class="primario" id="play" type="button">Reproducir</button>
  <button id="atras" type="button" aria-label="Fotograma anterior">‹</button>
  <button id="adelante" type="button" aria-label="Fotograma siguiente">›</button>
  <label for="tiempo" class="sr">Tiempo</label>
  <input id="tiempo" type="range" min="0" max="45.983" step="0.016667" value="0" aria-label="Tiempo">
  <output id="reloj" for="tiempo">0,000 s</output>
  <label><input id="sonido" type="checkbox" checked> Con sonido</label>
</div>
<!-- Vista previa para editar: el mismo código que renderiza el MP4 (render.html),
     pintado en tiempo real. El vídeo final sale de tools/servidor.py; ver README.md. -->
<script src="src/fuentes.js"></script>
<script src="src/iconos.js"></script>
<script src="src/base.js"></script>
<script src="src/gl.js"></script>
<script src="src/piezas.js"></script>
<script src="src/escenas.js"></script>
<script src="src/audio.js"></script>
<script>
(async () => {
  const D = window.D;
  const lienzo = document.getElementById('lienzo');
  D.canvas = lienzo;
  const deslizador = document.getElementById('tiempo'), reloj = document.getElementById('reloj');
  const play = document.getElementById('play'), sonido = document.getElementById('sonido');
  let t = 0, andando = false, inicio = 0, desde = 0, audioCtx = null, fuente = null, musica = null;
  deslizador.max = (D.DUR - 1 / D.FPS).toFixed(4);
  const pintar = async () => {
    await window.seek(t);
    deslizador.value = t;
    reloj.value = t.toFixed(3).replace('.', ',') + ' s';
  };
  const parar = () => {
    andando = false;
    play.textContent = 'Reproducir';
    if (fuente) { fuente.stop(); fuente = null; }
  };
  const bucle = async () => {
    if (!andando) return;
    t = desde + (audioCtx ? audioCtx.currentTime - inicio : (performance.now() - inicio) / 1000);
    if (t >= D.DUR) { t = D.DUR - 1 / D.FPS; parar(); }
    await pintar();
    requestAnimationFrame(bucle);
  };
  play.addEventListener('click', async () => {
    if (andando) { parar(); return; }
    if (t >= D.DUR - 0.02) t = 0;
    desde = t;
    andando = true;
    play.textContent = 'Pausar';
    if (sonido.checked) {
      if (!musica) { play.textContent = 'Preparando la música…'; musica = await D.renderAudio(); play.textContent = 'Pausar'; }
      audioCtx = audioCtx || new AudioContext({ sampleRate: 48000 });
      fuente = audioCtx.createBufferSource();
      fuente.buffer = musica;
      fuente.connect(audioCtx.destination);
      inicio = audioCtx.currentTime + 0.05;
      fuente.start(inicio, desde);
    } else { audioCtx = null; inicio = performance.now(); }
    requestAnimationFrame(bucle);
  });
  deslizador.addEventListener('input', () => { parar(); t = +deslizador.value; pintar(); });
  const paso = (n) => { parar(); t = D.clamp(Math.round(t * D.FPS + n) / D.FPS, 0, D.DUR - 1 / D.FPS); pintar(); };
  document.getElementById('atras').addEventListener('click', () => paso(-1));
  document.getElementById('adelante').addEventListener('click', () => paso(1));
  document.addEventListener('keydown', (e) => {
    if (e.target === deslizador) return;
    if (e.key === 'ArrowLeft') paso(-1);
    if (e.key === 'ArrowRight') paso(1);
    if (e.key === ' ') { e.preventDefault(); play.click(); }
  });
  await pintar();
})();
</script>
</body>
</html>
