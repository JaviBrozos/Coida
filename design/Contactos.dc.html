<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
    a { color: #29B6F0; } a:hover { color: #F2F7FB; }
    .pulsable { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 90ms linear, border-color 90ms linear; }
    .pulsable:active { border-color: #29B6F0 !important; }
  </style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; padding: 20px; background: #0A1622; color: #F2F7FB; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: row; align-items: center; gap: 16px;">
    <div class="pulsable" role="button" tabindex="0" aria-label="Volver a ajustes" style="width: 56px; height: 56px; border-radius: 16px; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; color: #9FC4DC; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"></path></svg>
    </div>
    <div style="font-size: 30px; line-height: 38px; font-weight: 700;">Contactos</div>
  </div>

  <div style="font-size: 20px; line-height: 28px; font-weight: 500; color: #9FC4DC;">Los que estén activados salen arriba del todo en la pantalla de inicio, con su foto y una sola pulsación. Caben cuatro.</div>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{contactos}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 20px;">
        <div style="display: flex; flex-direction: row; align-items: center; gap: 14px;">
          <div style="width: 64px; height: 64px; border-radius: 32px; background: #17384F; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#29B6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c0-3.4 3.2-5.6 7.2-5.6s7.2 2.2 7.2 5.6"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; flex-grow: 1;">
            <span style="font-size: 24px; line-height: 32px; font-weight: 600;">{{c.nombre}}</span>
            <span style="font-size: 20px; line-height: 28px; font-weight: 500; color: #9FC4DC;">{{c.telefono}}</span>
          </div>
          <div class="pulsable" role="button" tabindex="0" aria-label="Mostrar en la pantalla de inicio" onClick="{{c.cambia}}" style="width: 72px; height: 40px; border-radius: 20px; padding: 4px; box-sizing: border-box; display: flex; flex-direction: row; justify-content: {{c.interruptor.lado}}; background: {{c.interruptor.fondo}}; border: 2px solid {{c.interruptor.borde}}; flex-shrink: 0;">
            <div style="width: 28px; height: 28px; border-radius: 14px; background: {{c.interruptor.bola}};"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: row; gap: 8px;">
          <sc-for list="{{c.acciones}}" as="a" hint-placeholder-count="3">
            <div class="pulsable" role="button" tabindex="0" onClick="{{a.elige}}" style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 19px; font-weight: 600; background: {{a.fondo}}; color: {{a.color}}; border: 2px solid {{a.borde}};">{{a.etiqueta}}</div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div class="pulsable" role="button" tabindex="0" style="height: 72px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; background: #29B6F0; border: 2px solid #29B6F0; border-radius: 18px; color: #0A1622;">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13"></path><path d="M5.5 12h13"></path></svg>
    <span style="font-size: 22px; line-height: 30px; font-weight: 600;">Añadir contacto</span>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      contactos: [
        { id: 'c1', nombre: '[Nombre 1]', telefono: '[teléfono]', accion: 'llamada', enInicio: true },
        { id: 'c2', nombre: '[Nombre 2]', telefono: '[teléfono]', accion: 'videollamada', enInicio: true },
        { id: 'c3', nombre: '[Nombre 3]', telefono: '[teléfono]', accion: 'whatsapp', enInicio: false }
      ]
    };
  }
  cambiaAccion(id, accion) {
    this.setState({
      contactos: this.state.contactos.map(function (c) {
        return c.id === id ? Object.assign({}, c, { accion: accion }) : c;
      })
    });
  }
  cambiaInicio(id) {
    this.setState({
      contactos: this.state.contactos.map(function (c) {
        return c.id === id ? Object.assign({}, c, { enInicio: !c.enInicio }) : c;
      })
    });
  }
  renderVals() {
    var self = this;
    var etiquetas = [
      { clave: 'llamada', texto: 'Llamada' },
      { clave: 'videollamada', texto: 'Videollamada' },
      { clave: 'whatsapp', texto: 'WhatsApp' }
    ];
    return {
      contactos: this.state.contactos.map(function (c) {
        return {
          nombre: c.nombre,
          telefono: c.telefono,
          cambia: function () { self.cambiaInicio(c.id); },
          interruptor: {
            lado: c.enInicio ? 'flex-end' : 'flex-start',
            fondo: c.enInicio ? '#29B6F0' : '#0A1622',
            borde: c.enInicio ? '#29B6F0' : '#3D7AA6',
            bola: c.enInicio ? '#0A1622' : '#9FC4DC'
          },
          acciones: etiquetas.map(function (e) {
            var activa = c.accion === e.clave;
            return {
              etiqueta: e.texto,
              elige: function () { self.cambiaAccion(c.id, e.clave); },
              fondo: activa ? '#29B6F0' : 'transparent',
              color: activa ? '#0A1622' : '#9FC4DC',
              borde: activa ? '#29B6F0' : '#3D7AA6'
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
