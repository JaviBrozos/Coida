<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
    a { color: #29B6F0; } a:hover { color: #F2F7FB; }
    .tecla { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 90ms linear, border-color 90ms linear; }
    .tecla:active { background-color: #17384F !important; border-color: #29B6F0 !important; }
  </style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; padding: 20px; background: #0A1622; color: #F2F7FB; display: flex; flex-direction: column; gap: 20px;">
  <div class="tecla" role="button" tabindex="0" aria-label="Volver a la pantalla de inicio" style="width: 56px; height: 56px; border-radius: 16px; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; color: #9FC4DC;">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"></path></svg>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 30px; line-height: 38px; font-weight: 700;">Ajustes de Doado</div>
    <div style="font-size: 22px; line-height: 30px; font-weight: 500; color: #9FC4DC;">Introduce el PIN de 4 cifras</div>
  </div>
  <div style="display: flex; flex-direction: row; align-items: center; gap: 18px; height: 44px;">
    <sc-for list="{{puntos}}" as="p" hint-placeholder-count="4">
      <div style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #3D7AA6; background: {{p.fondo}};"></div>
    </sc-for>
    <span style="font-size: 20px; line-height: 28px; font-weight: 600; color: {{avisoColor}}; margin-left: 8px;">{{aviso}}</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
    <sc-for list="{{teclas}}" as="t" hint-placeholder-count="9">
      <div class="tecla" role="button" tabindex="0" onClick="{{t.pulsa}}" style="height: 76px; display: flex; align-items: center; justify-content: center; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 18px; font-size: 30px; font-weight: 600;">{{t.etiqueta}}</div>
    </sc-for>
    <div class="tecla" role="button" tabindex="0" aria-label="Borrar todo" onClick="{{limpiar}}" style="height: 76px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid #3D7AA6; border-radius: 18px; font-size: 22px; font-weight: 600; color: #9FC4DC;">Borrar</div>
    <div class="tecla" role="button" tabindex="0" onClick="{{cero}}" style="height: 76px; display: flex; align-items: center; justify-content: center; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 18px; font-size: 30px; font-weight: 600;">0</div>
    <div class="tecla" role="button" tabindex="0" aria-label="Borrar la última cifra" onClick="{{borrar}}" style="height: 76px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid #3D7AA6; border-radius: 18px; color: #9FC4DC;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12z"></path><path d="M12.5 9.5 16 13"></path><path d="M16 9.5 12.5 13"></path></svg>
    </div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="display: flex; flex-direction: row; align-items: flex-start; gap: 12px; padding: 16px; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 18px;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#29B6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"></path></svg>
    <span style="font-size: 20px; line-height: 28px; font-weight: 500; color: #9FC4DC;">El PIN lo pone quien configura el móvil. Así nadie entra en los ajustes sin querer.</span>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cifras: '' };
  }
  pulsar(n) {
    if (this.state.cifras.length >= 4) { return; }
    this.setState({ cifras: this.state.cifras + n });
  }
  renderVals() {
    var self = this;
    var cifras = this.state.cifras;
    var puntos = [0, 1, 2, 3].map(function (i) {
      return { fondo: i < cifras.length ? '#29B6F0' : 'transparent' };
    });
    var teclas = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
      return { etiqueta: String(n), pulsa: function () { self.pulsar(String(n)); } };
    });
    return {
      puntos: puntos,
      teclas: teclas,
      cero: function () { self.pulsar('0'); },
      borrar: function () { self.setState({ cifras: cifras.slice(0, -1) }); },
      limpiar: function () { self.setState({ cifras: '' }); },
      aviso: cifras.length === 4 ? 'Abriendo ajustes…' : '',
      avisoColor: '#29B6F0'
    };
  }
}
</script>
</body>
</html>
