<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #0B1D2E; } a:hover { color: #29B6F0; }
    .casilla { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 90ms linear; }
    .casilla:active { background-color: #29B6F0 !important; color: #0B1D2E !important; border-color: #0B1D2E !important; }
  </style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; padding: 20px; background: #29B6F0; color: #0B1D2E; display: flex; flex-direction: column;">
  <div style="padding-bottom: 20px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px;">
    <div style="display: flex; flex-direction: column;">
      <div style="font-size: 64px; line-height: 72px; font-weight: 700;">{{hora}}</div>
      <div style="font-size: 24px; line-height: 34px; font-weight: 500; margin-top: 4px;">{{fecha}}</div>
    </div>
    <svg viewBox="0 0 108 108" width="76" height="76" aria-hidden="true" style="flex-shrink: 0;">
      <path d="M34,28 h12 a26,26 0 0 1 0,52 h-12 z" fill="#0B1D2E"></path>
      <path d="M35.9,56.3 L44.3,62.6 L59.7,48.1" fill="none" stroke="#29B6F0" stroke-width="3.2" stroke-linecap="square"></path>
    </svg>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <div class="casilla" role="button" tabindex="0" aria-label="Abrir Llamar" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 12px; box-sizing: border-box; border: 3px solid #0B1D2E; border-radius: 24px; background: #0B1D2E; color: #29B6F0;">
      <svg viewBox="0 0 24 24" width="104" height="104" fill="currentColor" aria-hidden="true"><path d="M20.01,15.38c-1.23,0 -2.42,-0.2 -3.53,-0.56 -0.35,-0.12 -0.74,-0.03 -1.01,0.24l-1.57,1.97c-2.83,-1.35 -5.48,-3.9 -6.89,-6.83l1.95,-1.66c0.27,-0.28 0.35,-0.67 0.24,-1.02 -0.37,-1.11 -0.56,-2.3 -0.56,-3.53 0,-0.54 -0.45,-0.99 -0.99,-0.99H4.19C3.65,3 3,3.24 3,3.99 3,13.28 10.73,21 20.01,21c0.71,0 0.99,-0.63 0.99,-1.18v-3.45c0,-0.54 -0.45,-0.99 -0.99,-0.99z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Llamar</span>
    </div>
    <div class="casilla" role="button" tabindex="0" aria-label="Abrir Mensajes" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 12px; box-sizing: border-box; border: 3px solid #0B1D2E; border-radius: 24px; background: #0B1D2E; color: #29B6F0;">
      <svg viewBox="0 0 24 24" width="104" height="104" fill="currentColor" aria-hidden="true"><path d="M4,3 h16 a2,2 0 0 1 2,2 v10 a2,2 0 0 1 -2,2 h-8.5 l-5.5,4 v-4 h-2 a2,2 0 0 1 -2,-2 v-10 a2,2 0 0 1 2,-2 z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Mensajes</span>
    </div>
    <div class="casilla" role="button" tabindex="0" aria-label="Abrir Cámara" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 12px; box-sizing: border-box; border: 3px solid #0B1D2E; border-radius: 24px; background: #0B1D2E; color: #29B6F0;">
      <svg viewBox="0 0 24 24" width="104" height="104" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M9.5,3 h5 l1.3,2 h3.2 a2,2 0 0 1 2,2 v10 a2,2 0 0 1 -2,2 h-15 a2,2 0 0 1 -2,-2 v-10 a2,2 0 0 1 2,-2 h3.2 z M12,8.5 a3.6,3.6 0 1 0 0.01,0 z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Cámara</span>
    </div>
    <div class="casilla" role="button" tabindex="0" aria-label="Abrir Contactos" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 12px; box-sizing: border-box; border: 3px solid #0B1D2E; border-radius: 24px; background: #0B1D2E; color: #29B6F0;">
      <svg viewBox="0 0 24 24" width="104" height="104" fill="currentColor" aria-hidden="true"><path d="M12,3.5 a3.8,3.8 0 1 0 0.01,0 z M12,13.2 c-4.6,0 -8,2.4 -8,5.6 v1.7 h16 v-1.7 c0,-3.2 -3.4,-5.6 -8,-5.6 z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Contactos</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: new Date() };
  }
  componentDidMount() {
    this.timer = setInterval(function () { this.setState({ now: new Date() }); }.bind(this), 15000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    var d = this.state.now;
    return {
      hora: d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
      fecha: d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
    };
  }
}
</script>
</body>
</html>
