<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
    a { color: #29B6F0; } a:hover { color: #F2F7FB; }
    .pulsable { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 90ms linear, border-color 90ms linear; }
    .pulsable:active { background-color: #17384F !important; border-color: #29B6F0 !important; }
  </style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; padding: 20px; background: #0A1622; color: #F2F7FB; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px;">
    <div style="display: flex; flex-direction: column;">
      <div style="font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.01em;">{{hora}}</div>
      <div style="font-size: 22px; line-height: 30px; font-weight: 500; color: #9FC4DC;">{{fecha}}</div>
    </div>
    <svg viewBox="0 0 108 108" width="52" height="52" aria-hidden="true" style="flex-shrink: 0;">
      <path d="M34,28 h12 a26,26 0 0 1 0,52 h-12 z" fill="#29B6F0"></path>
      <path d="M35.9,56.3 L44.3,62.6 L59.7,48.1" fill="none" stroke="#0A1622" stroke-width="3.2" stroke-linecap="square"></path>
    </svg>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; height: 96px;">
    <div class="pulsable" role="button" tabindex="0" aria-label="Llamar a Nombre 1" style="display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 20px;">
      <div style="width: 56px; height: 56px; border-radius: 28px; background: #17384F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#29B6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c0-3.4 3.2-5.6 7.2-5.6s7.2 2.2 7.2 5.6"></path></svg>
      </div>
      <span style="font-size: 22px; line-height: 30px; font-weight: 600;">[Nombre 1]</span>
    </div>
    <div class="pulsable" role="button" tabindex="0" aria-label="Llamar a Nombre 2" style="display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 20px;">
      <div style="width: 56px; height: 56px; border-radius: 28px; background: #17384F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#29B6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c0-3.4 3.2-5.6 7.2-5.6s7.2 2.2 7.2 5.6"></path></svg>
      </div>
      <span style="font-size: 22px; line-height: 30px; font-weight: 600;">[Nombre 2]</span>
    </div>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <div class="pulsable" role="button" tabindex="0" aria-label="Abrir Llamar" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 12px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 22px;">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="#29B6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.4 3.6h3.2l1.5 4-2.1 1.5a12.5 12.5 0 0 0 6 6l1.5-2.1 4 1.5v3.2a1.6 1.6 0 0 1-1.7 1.6A16.8 16.8 0 0 1 4.8 5.3a1.6 1.6 0 0 1 1.6-1.7z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Llamar</span>
    </div>
    <div class="pulsable" role="button" tabindex="0" aria-label="Abrir Mensajes" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 12px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 22px;">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="#29B6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.2A2.2 2.2 0 0 1 6.2 4h11.6A2.2 2.2 0 0 1 20 6.2v7.6a2.2 2.2 0 0 1-2.2 2.2H10l-4.6 3.4V16h-1.2A2.2 2.2 0 0 1 4 13.8z"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Mensajes</span>
    </div>
    <div class="pulsable" role="button" tabindex="0" aria-label="Abrir Cámara" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 12px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 22px;">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="#29B6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 8.2A2.2 2.2 0 0 1 5.8 6h2.4l1.3-2h5l1.3 2h2.4a2.2 2.2 0 0 1 2.2 2.2v8.6a2.2 2.2 0 0 1-2.2 2.2H5.8a2.2 2.2 0 0 1-2.2-2.2z"></path><circle cx="12" cy="12.4" r="3.4"></circle></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Cámara</span>
    </div>
    <div class="pulsable" role="button" tabindex="0" aria-label="Abrir Contactos" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 12px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 22px;">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="#29B6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"></circle><path d="M5 19.4c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6"></path></svg>
      <span style="font-size: 24px; line-height: 32px; font-weight: 600; text-align: center;">Contactos</span>
    </div>
  </div>
  <div class="pulsable" role="button" tabindex="0" aria-label="Abrir ajustes, protegido con PIN" style="height: 72px; display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 0 20px; box-sizing: border-box; background: transparent; border: 2px solid #3D7AA6; border-radius: 20px; color: #9FC4DC;">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="10" cy="17" r="2"></circle></svg>
    <span style="font-size: 22px; line-height: 30px; font-weight: 600; flex-grow: 1;">Ajustes</span>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"></path></svg>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: new Date() };
  }
  componentDidMount() {
    this.timer = setInterval(function () { this.setState({ now: new Date() }); }.bind(this), 15000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    var d = this.state.now;
    return {
      hora: d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
      fecha: d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
    };
  }
}
</script>
</body>
</html>
