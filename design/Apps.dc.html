<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
    a { color: #29B6F0; } a:hover { color: #F2F7FB; }
    .pulsable { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 90ms linear, border-color 90ms linear; }
    .pulsable:active { border-color: #29B6F0 !important; }
  </style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; padding: 20px; background: #0A1622; color: #F2F7FB; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: row; align-items: center; gap: 16px;">
    <div class="pulsable" role="button" tabindex="0" aria-label="Volver a ajustes" style="width: 56px; height: 56px; border-radius: 16px; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; color: #9FC4DC; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"></path></svg>
    </div>
    <div style="font-size: 30px; line-height: 38px; font-weight: 700;">Aplicaciones</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9FC4DC;">En la pantalla de inicio</div>
    <sc-for list="{{instaladas}}" as="a" hint-placeholder-count="4">
      <div class="pulsable" role="button" tabindex="0" onClick="{{a.cambia}}" style="height: 72px; display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 18px;">
        <div style="width: 44px; height: 44px; border-radius: 14px; background: #17384F; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #29B6F0; flex-shrink: 0;">{{a.inicial}}</div>
        <span style="font-size: 22px; line-height: 30px; font-weight: 600; flex-grow: 1;">{{a.nombre}}</span>
        <div style="width: 72px; height: 40px; border-radius: 20px; padding: 4px; box-sizing: border-box; display: flex; flex-direction: row; justify-content: {{a.interruptor.lado}}; background: {{a.interruptor.fondo}}; border: 2px solid {{a.interruptor.borde}}; flex-shrink: 0;">
          <div style="width: 28px; height: 28px; border-radius: 14px; background: {{a.interruptor.bola}};"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9FC4DC;">Añadir aplicaciones</div>
    <sc-for list="{{sugeridas}}" as="s" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 16px; box-sizing: border-box; background: #122A3E; border: 2px solid #3D7AA6; border-radius: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #17384F; border: 2px solid #3D7AA6; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #29B6F0; flex-shrink: 0;">{{s.inicial}}</div>
        <div style="display: flex; flex-direction: column; flex-grow: 1;">
          <span style="font-size: 22px; line-height: 30px; font-weight: 600;">{{s.nombre}}</span>
          <span style="font-size: 19px; line-height: 26px; font-weight: 500; color: #9FC4DC;">{{s.para}}</span>
        </div>
        <div class="pulsable" role="button" tabindex="0" onClick="{{s.pulsa}}" style="height: 52px; padding: 0 18px; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 20px; font-weight: 600; background: {{s.boton.fondo}}; color: {{s.boton.color}}; border: 2px solid {{s.boton.borde}}; flex-shrink: 0;">{{s.boton.etiqueta}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: row; align-items: flex-start; gap: 12px; padding: 16px; background: transparent; border: 2px solid #3D7AA6; border-radius: 18px;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#29B6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 3.5 5 6.2v5.3c0 4 2.9 7.6 7 9 4.1-1.4 7-5 7-9V6.2z"></path><path d="M9.2 12.2l2 2 3.6-3.8"></path></svg>
    <span style="font-size: 19px; line-height: 26px; font-weight: 500; color: #9FC4DC;">Instalar cualquier otra aplicación pide el modo administrador. Una vez instalada, aparece aquí para activarla en el inicio.</span>
  </div>

  <div style="flex-grow: 1;"></div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      apps: [
        { id: 'tel', nombre: 'Llamar', inicial: 'L', visible: true },
        { id: 'sms', nombre: 'Mensajes', inicial: 'M', visible: true },
        { id: 'cam', nombre: 'Cámara', inicial: 'C', visible: true },
        { id: 'con', nombre: 'Contactos', inicial: 'P', visible: false }
      ],
      sugeridas: [
        { id: 'wa', nombre: 'WhatsApp', inicial: 'W', para: 'Mensajes y videollamadas', estado: 'no' },
        { id: 'sf', nombre: 'Sofascore', inicial: 'S', para: 'Resultados y partidos en directo', estado: 'no' }
      ]
    };
    this.temporizadores = [];
  }
  componentWillUnmount() {
    this.temporizadores.forEach(clearTimeout);
  }
  cambiaVisible(id) {
    this.setState({
      apps: this.state.apps.map(function (a) {
        return a.id === id ? Object.assign({}, a, { visible: !a.visible }) : a;
      })
    });
  }
  ponEstado(id, estado) {
    this.setState({
      sugeridas: this.state.sugeridas.map(function (s) {
        return s.id === id ? Object.assign({}, s, { estado: estado }) : s;
      })
    });
  }
  instala(id) {
    var self = this;
    this.ponEstado(id, 'instalando');
    this.temporizadores.push(setTimeout(function () { self.ponEstado(id, 'listo'); }, 1400));
  }
  renderVals() {
    var self = this;
    var botones = {
      no: { etiqueta: 'Instalar', fondo: '#29B6F0', color: '#0A1622', borde: '#29B6F0' },
      instalando: { etiqueta: 'Instalando…', fondo: 'transparent', color: '#9FC4DC', borde: '#3D7AA6' },
      listo: { etiqueta: 'En el inicio', fondo: 'transparent', color: '#29B6F0', borde: '#29B6F0' }
    };
    return {
      instaladas: this.state.apps.map(function (a) {
        return {
          nombre: a.nombre,
          inicial: a.inicial,
          cambia: function () { self.cambiaVisible(a.id); },
          interruptor: {
            lado: a.visible ? 'flex-end' : 'flex-start',
            fondo: a.visible ? '#29B6F0' : '#0A1622',
            borde: a.visible ? '#29B6F0' : '#3D7AA6',
            bola: a.visible ? '#0A1622' : '#9FC4DC'
          }
        };
      }),
      sugeridas: this.state.sugeridas.map(function (s) {
        return {
          nombre: s.nombre,
          inicial: s.inicial,
          para: s.para,
          boton: botones[s.estado],
          pulsa: function () { if (s.estado === 'no') { self.instala(s.id); } }
        };
      })
    };
  }
}
</script>
</body>
</html>
