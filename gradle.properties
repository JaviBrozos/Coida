# Memoria para el demonio de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Ejecuta en paralelo los módulos independientes y cachea resultados entre builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX en lugar de las librerías de soporte antiguas.
android.useAndroidX=true

# Cada módulo genera solo su propia clase R (builds más rápidos y limpios).
android.nonTransitiveRClass=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
